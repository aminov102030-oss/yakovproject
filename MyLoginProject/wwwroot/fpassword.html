<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
    <meta charset="utf-8" />
    <title>שחזור סיסמה - סימולטור OSI</title>
    <style>
        * { box-sizing: border-box; }
        body { 
            font-family: Arial, sans-serif; 
            display: flex; 
            justify-content: center; 
            align-items: center; 
            height: 100vh; 
            margin: 0; 
            background: linear-gradient(135deg, #e2e8f0 0%, #cbd5e1 100%);
        }
        .main-card {
            display: flex;
            width: 950px;
            height: 600px;
            background: #ffffff;
            border-radius: 20px;
            box-shadow: 0 15px 35px rgba(0, 0, 0, 0.1);
            overflow: hidden;
        }
        .form-side {
            flex: 1;
            padding: 40px;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            text-align: center;
        }
        .form-side p.subtitle {
            color: #64748b;
            font-size: 13px;
            margin-bottom: 20px;
        }
        .input-group {
            width: 100%;
            margin-bottom: 12px;
            text-align: right;
        }
        input[type="email"],
        input[type="password"],
        input[type="text"] { 
            width: 100%; 
            padding: 11px 15px; 
            background: #f8fafc;
            border: 1px solid #e2e8f0; 
            border-radius: 10px; 
            font-size: 14px; 
            outline: none;
            transition: 0.3s;
        }
        input:focus { 
            border-color: #6366f1; 
            background: #fff;
            box-shadow: 0 0 0 3px rgba(99, 102, 241, 0.1);
        }
        .extra-links {
            width: 100%;
            display: flex;
            justify-content: flex-start;
            font-size: 13px;
            margin-bottom: 12px;
        }
        .extra-links a {
            color: #6366f1;
            text-decoration: none;
            cursor: pointer;
        }
        .extra-links a:hover { text-decoration: underline; }
        button.submit-btn { 
            width: 100%; 
            padding: 11px; 
            background: linear-gradient(135deg, #6366f1 0%, #4f46e5 100%); 
            color: white; 
            border: none; 
            border-radius: 10px; 
            cursor: pointer; 
            font-size: 15px; 
            font-weight: bold;
            margin-top: 5px;
            transition: 0.3s;
        }
        button.submit-btn:hover { opacity: 0.9; }
        .logo-side {
            flex: 1;
            background: linear-gradient(135deg, #6366f1 0%, #4f46e5 100%);
            display: flex;
            justify-content: center;
            align-items: center;
        }
        .logo-box {
            background: rgba(255, 255, 255, 0.1);
            backdrop-filter: blur(10px);
            border: 1px solid rgba(255, 255, 255, 0.2);
            border-radius: 20px;
            padding: 40px;
            text-align: center;
            color: white;
            width: 80%;
            height: 75%;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
        }
        .logo-box h1 { font-size: 32px; margin: 0 0 10px 0; }
        .logo-box p { color: rgba(255, 255, 255, 0.8); font-size: 14px; margin: 0; }
        .hidden { display: none !important; }
    </style>
</head>
<body>

    <div class="main-card">
        <div class="form-side">
            <p class="subtitle" id="form-subtitle">שחזור סיסמה - שלב 1: אימייל</p>
            
            <!-- שלב 1: אימייל -->
            <div class="input-group" id="emailGroup">
                <input type="email" id="resetEmail" placeholder="הכנס את כתובת האימייל שלך" required />
            </div>

            <!-- שלב 2: קוד אימות -->
            <div class="input-group hidden" id="codeGroup">
                <input type="text" id="verificationCode" placeholder="הכנס את קוד האימות שנשלח למייל" required />
            </div>

            <!-- שלב 3: סיסמה חדשה -->
            <div class="input-group hidden" id="newPassGroup">
                <input type="password" id="newPassword" placeholder="סיסמה חדשה" />
            </div>
            <div class="input-group hidden" id="confirmNewPassGroup">
                <input type="password" id="confirmNewPassword" placeholder="אישור סיסמה חדשה" />
            </div>

            <div class="extra-links">
                <a href="login.html">חזרה למסך ההתחברות</a>
            </div>
            
            <button class="submit-btn" id="submitBtn" onclick="handleResetStep()">שלח קוד אימות</button>
        </div>

        <div class="logo-side">
            <div class="logo-box">
                <h1>OSI Simulator</h1>
                <p>מערכת ניהול ובקרת תקשורת רשתות</p>
            </div>
        </div>
    </div>

    <script>
        const API_BASE = window.location.port === '5025' ? '' : 'http://localhost:5025';
        let step = 1;
        let savedEmail = "";
        let savedCode = "";

        async function handleResetStep() {
            const submitBtn = document.getElementById('submitBtn');

            if (step === 1) {
                const email = document.getElementById('resetEmail').value.trim();
                if (!email) {
                    alert("נא להכניס כתובת אימייל.");
                    return;
                }

                submitBtn.disabled = true;
                submitBtn.innerText = "שולח קוד אימות למייל...";

                try {
                    const response = await fetch(`${API_BASE}/api/auth/forgot-password`, {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify({ email })
                    });
                    const data = await response.json();

                    if (data.success) {
                        savedEmail = email;
                        alert(data.message || `קוד אימות נשלח לכתובת: ${email}`);
                        document.getElementById('emailGroup').classList.add('hidden');
                        document.getElementById('codeGroup').classList.remove('hidden');
                        document.getElementById('form-subtitle').innerText = "שחזור סיסמה - שלב 2: אימות קוד";
                        submitBtn.innerText = "אמת קוד";
                        step = 2;
                    } else {
                        alert(data.message || "שגיאה בשליחת קוד האימות.");
                        submitBtn.innerText = "שלח קוד אימות";
                    }
                } catch (err) {
                    console.error(err);
                    alert("שגיאת תקשורת עם השרת.");
                    submitBtn.innerText = "שלח קוד אימות";
                } finally {
                    submitBtn.disabled = false;
                }
            } 
            else if (step === 2) {
                const code = document.getElementById('verificationCode').value.trim();
                if (!code) {
                    alert("נא להזין את קוד האימות בן 4 הספרות שנשלח למייל.");
                    return;
                }

                submitBtn.disabled = true;
                submitBtn.innerText = "מאמת קוד...";

                try {
                    const response = await fetch(`${API_BASE}/api/auth/verify-reset-code`, {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify({ email: savedEmail, code })
                    });
                    const data = await response.json();

                    if (data.success) {
                        savedCode = code;
                        alert(data.message || "הקוד אומת בהצלחה!");
                        document.getElementById('codeGroup').classList.add('hidden');
                        document.getElementById('newPassGroup').classList.remove('hidden');
                        document.getElementById('confirmNewPassGroup').classList.remove('hidden');
                        document.getElementById('form-subtitle').innerText = "שחזור סיסמה - שלב 3: סיסמה חדשה";
                        submitBtn.innerText = "עדכן סיסמה חדשה";
                        step = 3;
                    } else {
                        alert(data.message || "הקוד שהוזן שגוי. נסה שוב.");
                        submitBtn.innerText = "אמת קוד";
                    }
                } catch (err) {
                    console.error(err);
                    alert("שגיאת תקשורת עם השרת.");
                    submitBtn.innerText = "אמת קוד";
                } finally {
                    submitBtn.disabled = false;
                }
            } 
            else if (step === 3) {
                const newPassword = document.getElementById('newPassword').value;
                const confirmNewPassword = document.getElementById('confirmNewPassword').value;

                if (!newPassword) {
                    alert("נא להזין סיסמה חדשה.");
                    return;
                }
                if (newPassword !== confirmNewPassword) {
                    alert("הסיסמאות אינן תואמות.");
                    return;
                }

                submitBtn.disabled = true;
                submitBtn.innerText = "מעדכן סיסמה...";

                try {
                    const response = await fetch(`${API_BASE}/api/auth/reset-password`, {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify({ email: savedEmail, code: savedCode, newPassword })
                    });
                    const data = await response.json();

                    if (data.success) {
                        alert(data.message || "הסיסמה עודכנה בהצלחה במערכת!");
                        window.location.href = 'login.html';
                    } else {
                        alert(data.message || "שגיאה בעדכון הסיסמה.");
                        submitBtn.innerText = "עדכן סיסמה חדשה";
                    }
                } catch (err) {
                    console.error(err);
                    alert("שגיאת תקשורת עם השרת.");
                    submitBtn.innerText = "עדכן סיסמה חדשה";
                } finally {
                    submitBtn.disabled = false;
                }
            }
        }
    </script>
</body>
</html>
