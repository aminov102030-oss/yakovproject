<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>כניסת מנהל מערכת - OSI Simulator Admin</title>
    <link href="https://fonts.googleapis.com/css2?family=Assistant:wght@400;600;700;800&family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: 'Assistant', -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            background: #0f172a;
            color: #0f172a;
            direction: rtl;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }

        .login-card {
            background: #ffffff;
            border-radius: 20px;
            box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.5);
            width: 100%;
            max-width: 440px;
            padding: 40px 36px;
            border-top: 5px solid #dc2626;
        }

        .admin-badge-row {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 12px;
            margin-bottom: 20px;
        }

        .admin-badge-icon {
            width: 42px;
            height: 42px;
            background: linear-gradient(135deg, #dc2626 0%, #ea580c 100%);
            border-radius: 12px;
            display: flex;
            align-items: center;
            justify-content: center;
            color: white;
            font-size: 20px;
            box-shadow: 0 4px 12px rgba(220, 38, 38, 0.3);
        }

        .admin-header h1 {
            font-size: 24px;
            font-weight: 800;
            color: #0f172a;
            text-align: center;
            margin-bottom: 6px;
        }

        .admin-header p {
            font-size: 14px;
            color: #64748b;
            text-align: center;
            margin-bottom: 28px;
        }

        .form-group {
            margin-bottom: 20px;
        }

        .form-group label {
            display: block;
            font-size: 13px;
            font-weight: 700;
            color: #334155;
            margin-bottom: 8px;
        }

        .form-group input {
            width: 100%;
            padding: 12px 16px;
            border: 1px solid #cbd5e1;
            border-radius: 10px;
            font-size: 15px;
            font-family: inherit;
            transition: all 0.2s;
            outline: none;
        }

        .form-group input:focus {
            border-color: #dc2626;
            box-shadow: 0 0 0 3px rgba(220, 38, 38, 0.15);
        }

        .btn-admin-login {
            width: 100%;
            padding: 13px;
            background: linear-gradient(135deg, #dc2626 0%, #b91c1c 100%);
            color: white;
            border: none;
            border-radius: 10px;
            font-size: 15px;
            font-weight: 800;
            cursor: pointer;
            transition: all 0.2s;
            box-shadow: 0 4px 12px rgba(220, 38, 38, 0.25);
            margin-top: 8px;
        }

        .btn-admin-login:hover {
            transform: translateY(-1px);
            box-shadow: 0 6px 16px rgba(220, 38, 38, 0.35);
        }

        .admin-footer {
            margin-top: 24px;
            text-align: center;
            border-top: 1px solid #f1f5f9;
            padding-top: 18px;
        }

        .admin-footer a {
            color: #64748b;
            text-decoration: none;
            font-size: 13px;
            font-weight: 600;
            transition: color 0.2s;
        }

        .admin-footer a:hover {
            color: #0f172a;
        }
    </style>
</head>
<body>

    <div class="login-card">
        <div class="admin-badge-row">
            <div class="admin-badge-icon">🛡️</div>
        </div>
        <div class="admin-header">
            <h1>כניסת מנהל מערכת</h1>
            <p>פאנל בקרה וניהול בלעדי (Admin Portal)</p>
        </div>

        <form id="adminLoginForm" onsubmit="event.preventDefault(); adminLogin();">
            <div class="form-group">
                <label for="adminEmail">אימייל מנהל</label>
                <input type="email" id="adminEmail" placeholder="admin@example.com" required>
            </div>

            <div class="form-group">
                <label for="adminPassword">סיסמת מנהל</label>
                <input type="password" id="adminPassword" placeholder="••••••••" required>
            </div>

            <button type="submit" class="btn-admin-login">התחבר לפאנל הניהול</button>
        </form>

        <div class="admin-footer">
            <a href="../client/login.html">← חזרה למסך כניסת משתמשים / לקוחות</a>
        </div>
    </div>

    <script>
        const API_BASE = (window.location.port === '5025' || window.location.port === '')
            ? ''
            : `${window.location.protocol}//${window.location.hostname || 'localhost'}:5025`;

        async function adminLogin() {
            const email = document.getElementById('adminEmail').value.trim();
            const password = document.getElementById('adminPassword').value;

            if (!email || !password) {
                alert("נא למלא את כל השדות.");
                return;
            }

            try {
                const response = await fetch(`${API_BASE}/api/auth/login`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ email, password })
                });

                const data = await response.json().catch(() => ({}));

                if (response.ok && data.success) {
                    if (data.role !== 'Admin') {
                        alert("שגיאת הרשאה: משתמש זה אינו מנהל מערכת. נא להתחבר בפורטל הלקוחות.");
                        return;
                    }

                    if (data.fullname) sessionStorage.setItem('userName', data.fullname);
                    sessionStorage.setItem('userRole', data.role);
                    sessionStorage.setItem('userEmail', email);

                    alert("התחברת בהצלחה כמנהל מערכת!");
                    window.location.href = window.location.port === '5025' ? '/admin/dashboard.html' : 'dashboard.html';
                } else {
                    alert(data.message || "אימייל או סיסמה שגויים.");
                }
            } catch (err) {
                console.error("Admin login error:", err);
                alert("שגיאת תקשורת עם השרת.");
            }
        }
    </script>
</body>
</html>
